# Hermes Phase 1 validate workflow for ignitemarketing/growfieldservice.com
# Generated by scripts/onboard-repo.sh — repo-agnostic, parameterized from hermes.intake.yaml.
#
# This workflow IS the immutable base verifier. It is pinned by a repository
# ruleset to this path at refs/heads/main, so GitHub runs THIS file's content
# from main regardless of what a pull request does to its own copy.
#
# Deliberately minimal and credential-free:
#   - GitHub-hosted runner only
#   - no secrets, no environments, read-only token
#   - actions pinned by commit SHA, not tag
#   - install step runs the configured install command before tests

name: hermes-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hermes-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm

      - name: Runtime version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm run build

      - name: Verifier self-check (negative suite must fail)
        run: |
          NEG_DIR="$(mktemp -d)"
          NEG_FILE="$NEG_DIR/inline-negative.test.js"
          printf '%s\n' \
            'import { test } from "node:test";' \
            'import assert from "node:assert/strict";' \
            '' \
            'test("synthetic negative: this assertion must fail", () => {' \
            '  assert.equal(1, 2, "inline negative fixture -- expected failure");' \
            '});' \
            > "$NEG_FILE"
          if node --test "$NEG_FILE" >/dev/null 2>&1; then
            echo "::error::negative suite PASSED — the verifier is not executing tests"
            exit 1
          fi
          echo "negative suite failed as required — verifier is live"
