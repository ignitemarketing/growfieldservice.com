# Hermes Phase 1 validate workflow for ignitemarketing/growfieldservice.com
# Generated by scripts/onboard-repo.sh — repo-agnostic, parameterized from hermes.intake.yaml.
#
# This workflow IS the immutable base verifier. It is pinned by a repository
# ruleset to this path at refs/heads/main, so GitHub runs THIS file's content
# from main regardless of what a pull request does to its own copy.
#
# Deliberately minimal and credential-free:
#   - GitHub-hosted runner only
#   - no secrets, no environments, read-only token
#   - actions pinned by commit SHA, not tag
#   - no dependency install, so no lifecycle scripts execute

name: hermes-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hermes-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Runtime version
        run: echo 'no runtime version check configured'

      - name: Tests
        run: true

      - name: Verifier self-check (negative suite must fail)
        run: |
          echo "::notice::no negative-fixture pattern for this test command — skipping verifier self-check"
