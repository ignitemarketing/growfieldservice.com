# Hermes dependency unblock-on-close workflow for ignitemarketing/growfieldservice.com
# Generated by scripts/onboard-repo.sh — repo-agnostic, no per-repo parameters.

# This workflow deliberately does NOT use a Hermes GitHub App — stock
# GITHUB_TOKEN only, minimal authority (issues: write, nothing else).
#
# Finds every OPEN issue in this repo that GitHub's native issue-dependency
# graph records as blocked by the issue that just closed (the `blocking` /
# `blockedBy` JSON fields on `gh issue view` — the structured relationship
# `gh issue edit --add-blocked-by` writes, never issue-body text). For each
# dependent whose FULL blockedBy set is now all closed: removes the `hold`
# label (if present) and posts one comment. Idempotent: an issue with no
# `hold` label is left untouched, so re-closing a second blocker, or a
# workflow re-run, never double-comments. Never touches an issue carrying
# `no-autonomy`.

name: hermes-unblock

on:
  issues:
    types: [closed]

permissions:
  issues: write

concurrency:
  group: hermes-unblock-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  unblock:
    name: unblock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Unblock dependents of the closed issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOSED: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          blocking="$(gh issue view "$CLOSED" -R "$REPO" --json blocking --jq '(.blocking // [])[].number' 2>/dev/null || true)"
          if [ -z "$blocking" ]; then
            echo "issue #$CLOSED blocks nothing -- nothing to unblock"
            exit 0
          fi

          printf '%s\n' "$blocking" | while IFS= read -r dep; do
            [ -z "$dep" ] && continue

            dep_json="$(gh issue view "$dep" -R "$REPO" --json number,state,labels,blockedBy)"

            state="$(printf '%s' "$dep_json" | jq -r '.state')"
            if [ "$state" != "OPEN" ]; then
              echo "#$dep is not open -- skipping"
              continue
            fi

            has_no_autonomy="$(printf '%s' "$dep_json" | jq -r '((.labels // []) | map(.name)) | index("no-autonomy") != null')"
            if [ "$has_no_autonomy" = "true" ]; then
              echo "#$dep carries no-autonomy -- skipping"
              continue
            fi

            has_hold="$(printf '%s' "$dep_json" | jq -r '((.labels // []) | map(.name)) | index("hold") != null')"
            if [ "$has_hold" != "true" ]; then
              echo "#$dep has no hold label -- already unblocked or never held -- skipping"
              continue
            fi

            all_closed=true
            for b in $(printf '%s' "$dep_json" | jq -r '(.blockedBy // [])[].number'); do
              b_state="$(gh issue view "$b" -R "$REPO" --json state --jq '.state')"
              if [ "$b_state" != "CLOSED" ]; then
                all_closed=false
                break
              fi
            done

            if [ "$all_closed" != "true" ]; then
              echo "#$dep still has open blockers -- skipping"
              continue
            fi

            gh issue edit "$dep" -R "$REPO" --remove-label hold
            gh issue comment "$dep" -R "$REPO" --body "unblocked: blocker #$CLOSED closed"
            echo "#$dep unblocked (blocker #$CLOSED closed)"
          done
